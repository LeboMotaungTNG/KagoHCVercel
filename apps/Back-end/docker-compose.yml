version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: kagohc-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=kagohc
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kagohc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Optional: MongoDB Express (web UI for MongoDB)
  mongo-express:
    image: mongo-express
    container_name: kagohc-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
